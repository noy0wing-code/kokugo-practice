<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まちがいを なおそう</title><style>body{font-family:'Yu Gothic',sans-serif;max-width:820px;margin:auto;padding:14px;background:#f5f6fa;color:#222}h1{font-size:23px}button{cursor:pointer;border:1px solid #b6bdc9;border-radius:10px;padding:11px;background:white;font-size:17px}button:focus-visible{outline:3px solid #1875d1}.tabs,.actions,.choices{display:flex;gap:8px;flex-wrap:wrap}.tabs button{flex:1}.active{background:#dceeff;border:2px solid #246cb0}.paper{background:white;border:1px solid #b9bec6;border-radius:12px;overflow-x:auto;padding:18px 12px}.vertical{writing-mode:vertical-rl;text-orientation:mixed;font-family:'Yu Mincho','Noto Serif CJK JP',serif;font-size:24px;line-height:2;letter-spacing:.035em;height:350px;width:max-content;min-width:100%;}.char{cursor:pointer;border-radius:3px}.char.selected{background:#d6eaff;outline:1px solid #367fca}.editor,.result{background:white;border:1px solid #b9bec6;border-radius:12px;padding:14px;margin-top:12px}.choices button{font-family:'Yu Mincho',serif;font-size:23px;min-width:62px}.primary{background:#236db4;color:white;border-color:#236db4}.muted{color:#555;font-size:14px}.actions{margin-top:12px}.actions button{flex:1}#result{font-size:19px;font-weight:bold;text-align:center}#hintText{margin-top:6px}footer{margin-top:18px;font-size:12px;color:#666}</style></head><body><h1>まちがいを なおそう！</h1><p>ぶんを よんで、まちがっている もじを タッチして なおそう。</p><div id="tabs" class="tabs"></div><h2 id="title"></h2><div class="paper"><div id="paper" class="vertical"></div></div><div id="editor" class="editor" hidden><div style="display:flex;justify-content:space-between"><strong id="selectedLabel"></strong><button id="close">とじる ×</button></div><p class="muted">ただしいと おもったら、「そのまま」を えらぼう。</p><div id="choices" class="choices"></div></div><p id="instruction"></p><button id="hintBtn">ヒントを みる</button><p id="hintText" hidden></p><div id="result" class="result" hidden></div><div class="actions"><button id="check" class="primary">こたえあわせ</button><button id="reset">やりなおす</button><button id="next">つぎの もんだい →</button></div><footer>このページはインターネット接続なしでも使えます。解答はこの端末内で採点され、外部には送信されません。</footer><script>
(()=>{'use strict';const P=[{title:'だい1もん　こうえんで ★',lines:['きょう、ぼくわ おとうさんと こうえんえ いきました。','こうえんで、あかい はなお みつけました。'],rules:[['ぼくわ','ぼくは'],['こうえんえ','こうえんへ'],['はなお','はなを']],hint:'「は・わ」「へ・え」「を・お」を たしかめよう。'},{title:'だい2もん　きゅうしょく ★★',lines:['きょうの きゅうしょくわ カレーでした。','わたしわ スプーンお つかって たべました。','とても おいしかつたです。'],rules:[['きゅうしょくわ','きゅうしょくは'],['わたしわ','わたしは'],['スプーンお','スプーンを'],['おいしかつた','おいしかった']],hint:'「は・わ」「を・お」と、ちいさい「っ」を たしかめよう。'},{title:'だい3もん　えんそく ★★★',lines:['きのう、みんなと えんそくえ いきました。','おべんとうお たべた あと、ちよっと あそびました。','きれいな ちようちよお みつけました。','うれしくて、ぴよんぴょん はねました。'],rules:[['えんそくえ','えんそくへ'],['おべんとうお','おべんとうを'],['ちよっと','ちょっと'],['ちようちよお','ちょうちょを'],['ぴよんぴょん','ぴょんぴょん']],hint:'ちいさい「ょ」と おおきい「よ」を たしかめよう。'}];const orig=P.map(p=>p.lines.map(s=>Array.from(s)));function keyFor(p){const m=new Map();const lines=p.lines.map(s=>Array.from(s));for(const [a,b]of p.rules){const x=Array.from(a),y=Array.from(b);if(x.length!==y.length)throw Error('bad length');let hit=false;for(let li=0;li<lines.length&&!hit;li++){for(let i=0;i<=lines[li].length-x.length;i++){if(x.every((c,j)=>c===lines[li][i+j])){x.forEach((c,j)=>{if(c!==y[j])m.set(li+':'+(i+j),y[j])});hit=true;break}}}if(!hit)throw Error('missing '+a)}return m}const keys=P.map(keyFor);const states=orig.map(lines=>({lines:lines.map(a=>a.slice()),graded:false,hint:false}));let page=0,selected=null;const $=id=>document.getElementById(id);const pairs=[['は','わ'],['へ','え'],['を','お'],['つ','っ'],['や','ゃ'],['ゆ','ゅ'],['よ','ょ'],['あ','ぁ'],['い','ぃ'],['う','ぅ'],['え','ぇ'],['お','ぉ'],['か','が'],['き','ぎ'],['く','ぐ'],['け','げ'],['こ','ご'],['さ','ざ'],['し','じ'],['す','ず'],['せ','ぜ'],['そ','ぞ'],['た','だ'],['ち','ぢ'],['て','で'],['と','ど'],['は','ば','ぱ'],['ひ','び','ぴ'],['ふ','ぶ','ぷ'],['へ','べ','ぺ'],['ほ','ぼ','ぽ'],['ー','う','お']];function options(ch){const a=new Set([ch]);pairs.filter(p=>p.includes(ch)).forEach(p=>p.forEach(c=>a.add(c)));return [...a].slice(0,5)}function grade(){let n=0,extra=0;keys[page].forEach((v,k)=>{let [i,j]=k.split(':').map(Number);if(states[page].lines[i][j]===v)n++});states[page].lines.forEach((line,i)=>line.forEach((c,j)=>{if(!keys[page].has(i+':'+j)&&c!==orig[page][i][j])extra++}));return{n,extra,all:n===keys[page].size&&extra===0}}function render(){const s=states[page];$('tabs').replaceChildren();P.forEach((p,i)=>{let b=document.createElement('button');b.textContent='だい'+(i+1)+'もん';b.className=i===page?'active':'';b.onclick=()=>{page=i;selected=null;render()};$('tabs').append(b)});$('title').textContent=P[page].title;$('instruction').textContent=page===0?'まちがいは 3こ あるよ。':'ぜんぶ なおせたと おもったら、こたえあわせを しよう。';$('paper').replaceChildren();s.lines.forEach((line,i)=>{line.forEach((ch,j)=>{let span=document.createElement('span');span.textContent=ch;span.className='char'+(selected?.i===i&&selected?.j===j?' selected':'');if(ch.trim()&&!/[。、！？]/.test(ch)){span.setAttribute('role','button');span.tabIndex=0;const pick=()=>{selected={i,j};render()};span.onclick=pick;span.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}}}$('paper').append(span)});if(i<s.lines.length-1)$('paper').append(document.createElement('br'))});$('editor').hidden=!selected;if(selected){let ch=s.lines[selected.i][selected.j];$('selectedLabel').textContent='「'+ch+'」を どうする？';$('choices').replaceChildren();let unchanged=document.createElement('button');unchanged.textContent='そのまま';unchanged.onclick=()=>{selected=null;render()};$('choices').append(unchanged);let candidates=options(ch);candidates.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>{s.lines[selected.i][selected.j]=c;s.graded=false;selected=null;render()};$('choices').append(b)});if(candidates.length===1){let edit=document.createElement('button');edit.textContent='ほかの もじ';edit.onclick=()=>{const inp=document.createElement('input');inp.maxLength=1;inp.placeholder='１もじ';inp.style='width:90px;font-size:22px;padding:8px;border:1px solid #999;border-radius:8px';$('choices').append(inp);let save=document.createElement('button');save.textContent='きめる';save.onclick=()=>{if(Array.from(inp.value).length===1){s.lines[selected.i][selected.j]=inp.value;s.graded=false;selected=null;render()}};$('choices').append(save);inp.focus()};$('choices').append(edit)}}$('hintText').textContent=P[page].hint;$('hintText').hidden=!s.hint;$('hintBtn').textContent=s.hint?'ヒントを とじる':'ヒントを みる';$('result').hidden=!s.graded;if(s.graded){const r=grade();$('result').textContent=r.all?'🌟 ぜんぶ せいかい！':page===0?r.n+' / '+keys[page].size+' こ せいかい。もういちど よく よんでみよう。':'もうすこし！ まだ まちがいが あるよ。もういちど よく よもう。'}$('next').disabled=page===2}$('close').onclick=()=>{selected=null;render()};$('hintBtn').onclick=()=>{states[page].hint=!states[page].hint;render()};$('check').onclick=()=>{states[page].graded=true;selected=null;render()};$('reset').onclick=()=>{states[page]={lines:orig[page].map(a=>a.slice()),graded:false,hint:false};selected=null;render()};$('next').onclick=()=>{if(page<2){page++;selected=null;render()}};render()})();
</script></body></html>
